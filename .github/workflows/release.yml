name: Wydanie

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  kontrola:
    uses: ./.github/workflows/kontrola.yml

  wydanie:
    needs: kontrola
    runs-on: ubuntu-24.04
    env:
      SLUG: marcin-rynkowski-narzedzia
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Wersja z tagu zgodna z nagłówkiem i klasą Plugin
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -Po '^\s*\*\s*Version:\s*\K\S+' "$SLUG.php")
          CONST=$(grep -Po "const VERSION\s*= '\K[^']+" src/class-plugin.php)
          echo "tag=$TAG nagłówek=$HEADER stała=$CONST"
          [ "$TAG" = "$HEADER" ] && [ "$TAG" = "$CONST" ]

      # Ten sam skrypt co lokalnie; zip jest sprawdzany przed publikacją (bin/sprawdz-zip.sh).
      - name: Budowa i kontrola zipa
        run: bin/zbuduj-zip.sh build

      - name: Wydanie na GitHubie
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "build/$SLUG.zip" --title "$GITHUB_REF_NAME" --generate-notes
